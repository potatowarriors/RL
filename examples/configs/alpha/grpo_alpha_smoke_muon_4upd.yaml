# grpo_alpha_smoke_muon_4upd.yaml — 롤아웃당 4회 업데이트 분 단위 스모크 (단계별 검증 ②, 결정 40).
# R1 Muon 스모크(16 프롬프트 × 8, 4K 문맥, 3 step)에 2바퀴 설정의 알고리즘 부분만 얹는다: GBS 128 → 32 (4회), force_on_policy_ratio 끔, lr 3e-6.
# 확인할 것: 학습 전 logprob 계산이 실행되는지("▶ Computing logprobs") · step 당 optimizer.step 4회 · 지표 probs_ratio / probs_ratio_clamped / gen_kl_error 존재 ·
#   assert 없음. 수치 판정(gen KL < 0.002)은 ③ 실제 런 첫 step 들에서 한다. WANDB=0.
defaults: grpo_alpha_smoke_muon.yaml

loss_fn:
  force_on_policy_ratio: false

policy:
  train_global_batch_size: 32           # 16 × 8 ÷ 4
  megatron_cfg:
    optimizer:
      lr: 3.0e-6
      min_lr: 3.0e-6
