# alpha fleet 용 NeMo-Gym 모델 서버 — alpha_vllm_model_swe_8k.yaml 과 같고, 프록시 (:8100) 대신 백엔드 8 개를 직접 준다 (2026-11-25).
# 학습 경로와 같은 배정을 재려는 것이다: Gym 모델 서버가 세션 (롤아웃) id 의 해시로 엔진을 고른다 (`vllm_model/app.py` `_resolve_client`).
#   에이전트 프로세스는 모델 서버 쿠키를 들고 다니므로 (nv-OpenHands `nemo_gym_client.py`) 한 롤아웃의 모든 턴이 같은 엔진으로 간다.
#   fleet 프록시 (`lb_proxy.py`) 는 system + 첫 user 메시지로 고정해 한 과제의 반복 8 개가 엔진 하나에 몰린다 (11-25 S2b: 엔진별 4.5 ~ 20.8 요청).
# 전제: fleet 백엔드가 main1 의 8000 ~ 8007 에 있고 Gym 모델 서버도 main1 에서 돈다 (runs/eval_swe_student.sh). `policy_base_url` 은 쓰지 않는다.
policy_model:
  responses_api_models:
    alpha_vllm_model:
      entrypoint: app.py
      base_url:
        - http://127.0.0.1:8000/v1
        - http://127.0.0.1:8001/v1
        - http://127.0.0.1:8002/v1
        - http://127.0.0.1:8003/v1
        - http://127.0.0.1:8004/v1
        - http://127.0.0.1:8005/v1
        - http://127.0.0.1:8006/v1
        - http://127.0.0.1:8007/v1
      api_key: ${policy_api_key}
      model: ${policy_model_name}
      return_token_id_information: false
      uses_reasoning_parser: true
      uses_interleaved_reasoning: true
      chat_template_kwargs: null
      extra_body: null
      sampling_overrides: {temperature: 1.0, top_p: 1.0, max_tokens: 8192}
