# teacher_codemath_s3_alpha.yaml — Code·Math 3단계 (RL_PLAN.md 결정 39, 사용자 결정 2026-10-19/20).
#
# 2단계 결과 hf_step_00175 를 시작점으로, 전체 후보 풀을 DAPO 동적 샘플링으로 학습한다. 1·2단계 설정을 상속하고 바꾸는 것:
#   - 데이터: teacher_codemath_s3_v1.jsonl 53,418행 (고유 52,757 = 4 풀 53,377 − 2단계 검증 256 − 2단계 기록상 16/16 364; code 1~2/16 중복 661).
#     0/16 도 넣는다 — 학습 중 풀리기 시작하면 신호가 된다 (사용자 2026-10-19). tools/build_codemath_stage3_blend.py.
#   - DAPO 필터 grpo.async_grpo.drop_zero_std_groups: 전부 정답·전부 오답 그룹은 버퍼 전에 버리고 rollout_groups.jsonl 에 dropped 로 남긴다.
#     버린 몫은 초과 할당으로 메운다: 첫 바퀴 버림률 약 45% 예상 → 256 / 0.55 − 256 ≈ 210, 여유를 더해 250 (2단계 기록·P0-4 측정 기준).
#     s1 실측(10-20): 버림률 60% (전부 오답 57% · 전부 정답 3.6%). 초과 할당은 그대로 둔다 — 부족분은 보충 생성이 메우고(수집기 수정 `57f86ee1e`), 250 은 이월 깊이만 정한다.
#   - 프롬프트 128 (처음 256 — 호스트 OOM, 위 num_prompts_per_step 주석). 궤적 최대 나이 2 → 1: 생성이 병목이라 앞서 생성할 이득이 작고, 낡은 샘플은 10-16 붕괴의 요인이며 버퍼가 절반이 된다.
#   - 생성 상한 32K → 48K: P0-4 에서 어려운 수학 문제(1~2/8) 정답의 10.7% 가 28~32K 에 몰려 있다 (RL_DATA.md). 학습 시퀀스 상한 131072 는 그대로.
#   - 에폭: 데이터로더는 순환(CyclingDataLoader)이라 "에폭"은 명목값이다. 버림률 60% 면 데이터 한 바퀴 ≈ 53,418 × 0.4 / 256 ≈ 83 step.
#     max_num_steps 85 로 한 바퀴를 돌고, rollout_groups.jsonl 로 블렌드를 갱신해(16/16 제외 · 0/16 은 1/4 만) 다음 바퀴를 재개한다 (목표 3 바퀴).
#     max_num_epochs 2 는 클램프(2 × 208 = 416)가 걸리지 않게 둔 값이다.
#   - 검증 5 step 마다 (step 약 50분) · 저장 2 step 마다 (keep_top_k 2) · lr 5e-6 유지 (업데이트 수가 1/4 이라도 올리지 않는다 — 10-16 교훈).
#
# 실행 전 검사 (CPU):  python examples/configs/alpha/tools/check_alpha_recipe.py examples/configs/alpha/teacher_codemath_s3_alpha.yaml \
#                        data.train.data_path=<teacher_codemath_s3_v1.jsonl> data.validation.data_path=<teacher_codemath_s2_v1_val.jsonl>
# 실행: RECIPE=examples/configs/alpha/teacher_codemath_s3_alpha.yaml DATA=<teacher_codemath_s3_v1.jsonl> VAL=<teacher_codemath_s2_v1_val.jsonl> \
#         examples/configs/alpha/runs/launch.sh teacher_codemath_s3 <tag> \
#         policy.model_name=/home/work/vidsearch/repos/project_s/NeMo-RL/results/alpha/teacher_codemath_s2/hf/hf_step_00175
#   256 배치 전제 (KNOWN_ISSUES 10-13): 기동 전 main1 루트 여유 ≥ 300 GB, Ray spill 경로 확인.
defaults: teacher_codemath_alpha.yaml

checkpointing:
  checkpoint_dir: "results/alpha_teacher_codemath_s3"
  save_period: 4                        # step 약 35분 → 약 2.3시간마다. 보존은 runs 의 하드링크 보존 루프(40 step 마다)

grpo:
  num_prompts_per_step: 128             # 256 → 128 (사용자 결정 2026-10-20 22:10, KNOWN_ISSUES 10-20 호스트 OOM): CP8·EP8 은 DP1 이라 학습 워커 8개가 각각 전체 배치를 호스트에 올린다.
                                        #   256 × 17.5K 토큰 = 84 GB 배치 → 워커당 150 GB, 합계 1.2 TB 로 main1 1.9 TB 를 넘었다. 128 이면 배치 42 GB · 워커당 약 80 GB.
  max_num_steps: 167                    # 데이터 한 바퀴 ≈ 53,418 × 0.4 / 128 (s1~s3 실측 유지율 40%). 바퀴마다 블렌드 갱신 뒤 재개
  max_num_epochs: 2                     # 클램프 비활성 (명목 에폭 417 step)
  val_period: 10                        # step 약 35분 → 약 6시간마다
  val_at_start: true
  val_at_end: true
  async_grpo:
    max_trajectory_age_steps: 1         # 2 → 1 (위 주석)
    rollout_overprovision: 125          # 첫 배치 253 그룹; 이후 보충은 유지율로 크기 결정 (a3b6a3380)
    drop_zero_std_groups: true          # DAPO 동적 샘플링 (async 구현, 2026-10-19)
    rollout_group_log: ${logger.log_dir}/rollout_groups.jsonl
    drop_groups_over_gen_tokens: ${policy.generation.max_new_tokens}   # 생성 토큰이 상한을 넘는 샘플(2회 호출 궤적, 최대 98K 관측)이 든 그룹은 버린다 — 학습 배치는 최장 행에 맞춰 패딩되어 CP 랭크 8개에 복제된다 (KNOWN_ISSUES 10-20 호스트 OOM)

env:
  nemo_gym:
    # 단일 턴 과제: 응답이 상한에서 잘리면 Gym simple_agent 가 모델을 다시 불러 궤적이 2회 호출(최대 98K 토큰)이 된다.
    # max_steps 1 로 한 번만 부른다 (잘린 응답은 그대로 채점 → 오답). drop_groups_over_gen_tokens 는 2중 안전장치.
    code_gen_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    math_with_judge_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1

policy:
  megatron_cfg:
    scheduler:
      lr_warmup_iters: 0                # 워밍업 제거 (사용자 2026-10-20): Muon 은 업데이트를 정규화해 빈 모멘텀에서도 보폭이 튀지 않는다. 128 배치 step ≈ 35분이라 10 step 워밍업은 6시간
  generation:
    max_new_tokens: 49152               # 48K (위 주석)
