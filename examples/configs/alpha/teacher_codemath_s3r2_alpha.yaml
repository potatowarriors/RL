# teacher_codemath_s3r2_alpha.yaml — Code·Math 3단계 **2바퀴** (RL_PLAN.md 결정 40, 사용자 승인 2026-10-22).
#
# 1바퀴(teacher_codemath_s3_alpha.yaml, s5) 설정을 상속하고 세 가지를 바꾼다.
#   - 롤아웃당 업데이트 1회 → **4회**: train_global_batch_size 2,048 → 512 (128 × 16 ÷ 4). 워커가 롤아웃 배치를 4개의 전역 배치로 잘라
#     각각 optimizer.step() (megatron_policy_worker.py). force_on_policy_ratio 를 끄면 비율 π_new/π_old 가 살아나 clip 0.2/0.28 (DAPO Clip-Higher) 이 발동하고,
#     학습 전 logprob forward 가 한 번 추가된다 (step 은 생성 병목이라 시간은 거의 안 늘어남). 근거: FRONTIER.md (DAPO 16회 · R1 16회 · GSPO 4회 · MiMo staleness 4).
#   - lr 5e-6 → **3e-6** (MiMo-V2.6 Muon 값; 롤아웃당 보폭이 4배가 되므로 낮춘다).
#   - 데이터: 1바퀴 기록으로 갱신한 블렌드 (tools/build_codemath_round_blend.py: 16/16 제외 · 0/16 은 1/4 · code 1~2/16 중복).
# 유지: 128 프롬프트 · 초과 125 · 나이 1 · DAPO 동적 샘플링 · 과장 가드 · 48K · 토큰 단위 손실 · TIS [0.2, 5] · KL 0 · 워밍업 0.
#
# 재개 (1바퀴 마지막 ckpt 에서 이어 학습) — 독립 검토 2026-10-22 (Opus 5.5 xhigh, 판정 NOT READY → 수정) 가 찾은 세 함정:
#   F1 loss_fn.seq_logprob_error_in_loss 는 force_on_policy_ratio=true 를 요구한다 (grpo.py _validate_seq_logprob_error_in_loss) → 아래서 false.
#      같은 임계(2)를 별도 prev_logprob 패스에서 적용한다 — 비율을 켜면 그 패스는 어차피 돈다 (추가 비용 0).
#   F2 mcore 는 저장된 옵티마이저 param group 을 (max_lr, min_lr, …) 키로 짝짓는다 → lr 을 바꾸면 로드 실패 (ckpt step_44 로 CPU 재현).
#      경로 A: ++policy.megatron_cfg.checkpoint.load_optim=false (본체 패치 alpha/round2-resume) — 가중치·step·데이터로더·버퍼 재개, 옵티마이저·스케줄러는 설정에서 새로
#              (Muon 모멘텀 초기화, fp32 마스터는 bf16 가중치에서 재구성). 스케줄러 override 플래그 불필요.
#      경로 B: lr 5e-6 유지 + ++policy.megatron_cfg.scheduler.use_checkpoint_opt_param_scheduler=true (GBS 가 바뀌어 샘플 단위 warmup·decay 가 어긋남, 상수 lr 이라 수치 영향 없음 — KNOWN_ISSUES 10-13).
#   F3 데이터로더 가드는 dataset_name 만 비교 → 같은 NemoGymDataset 의 새 블렌드가 1바퀴 위치(샘플 수)를 이어받아 앞부분을 건너뛰거나 StopIteration.
#      본체 패치 alpha/round2-resume (data_path 도 비교) 로 새 파일은 처음부터.
#   에폭 클램프: max_num_epochs × len(새 데이터로더) 가 누적 max_num_steps 보다 커야 한다 (4 × 366 = 1,464 > 350).
#   결정 대기: grpo.async_grpo.shuffle_train_batch (검토 F4 — 전역 배치 4개가 완료 순서대로 잘려 1번째가 짧은 code 그룹에 치우침; 본체 패치 alpha/round2-resume).
# 게이트 (단계별): ① check_alpha_recipe ERROR 0 · 손실 단위 테스트 · 설정 검증기·param group 짝짓기·데이터로더 가드 CPU 프로브
#   ② teacher_codemath_s3r2_resume_smoke.yaml — ckpt 하드링크 사본에서 이 레시피로 1 step (약 20분). 동기 스모크 grpo_alpha_smoke_muon_4upd 는 검토 결과
#      비동기·TIS·마스킹·패킹·재개를 하나도 안 거쳐 대체.
#   ③ 이 런의 step 168~170 으로 판정: 옵티마이저 로드 오류 없음 · train/lr · "Dataset swap detected" · "Preparing for logprob inference" 줄 · global_valid_seqs ≈ (2,048−마스킹)/4 ·
#      gen KL ≤ 0.002 이고 1바퀴 중앙값(≈0.0008)의 1.5배를 넘으면 멈추고 점검 · 마스킹 수·is_oob_ratio ≤ 1바퀴 범위 · probs_ratio_min/max 기록 · step 시간·호스트 RSS 1바퀴 범위
#      → 통과하면 그대로 학습 지속. 주의: grad_norm 은 마지막 전역 배치 값, global_valid_seqs·num_valid_samples 는 전역 배치 평균(1/4), total_valid_tokens 도 1/4 (검토 F6).
# 실행: RECIPE=examples/configs/alpha/teacher_codemath_s3r2_alpha.yaml DATA=<round2 blend> VAL=<s2 _val> CKPT=<ckpt128_r2: step_167 하드링크 사본> \
#         examples/configs/alpha/runs/launch.sh teacher_codemath_s3 r2 grpo.max_num_steps=<167 + 2바퀴 step> ++policy.megatron_cfg.checkpoint.load_optim=false
defaults: teacher_codemath_s3_alpha.yaml

grpo:
  max_num_steps: 350                    # 누적 (1바퀴 167 + 2바퀴 약 183; 블렌드 확정 뒤 오버라이드로 맞춘다)
  max_num_epochs: 4                     # 클램프 비활성 (새 데이터로더 길이 × 4 > 누적 step)

loss_fn:
  force_on_policy_ratio: false          # 롤아웃당 4회 업데이트 → 비율·clip 0.2/0.28 활성 (결정 40)
  seq_logprob_error_in_loss: false      # 검토 F1 — 비율이 켜지면 loss 안 마스킹 불가 → 별도 prev_logprob 패스에서 임계 2 마스킹 (student_rlvr1 의 true 를 되돌림)

policy:
  train_global_batch_size: 512          # 128 × 16 ÷ 4 = 롤아웃당 전역 배치 4개 = 업데이트 4회
  megatron_cfg:
    optimizer:
      lr: 3.0e-6                        # MiMo-V2.6 Muon lr (결정 40)
      min_lr: 3.0e-6
