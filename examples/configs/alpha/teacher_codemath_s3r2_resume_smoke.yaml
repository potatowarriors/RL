# teacher_codemath_s3r2_resume_smoke.yaml — 2바퀴 **재개 스모크** (단계별 검증 ②). 독립 검토 2026-10-22 권고로 동기 스모크(grpo_alpha_smoke_muon_4upd)를 대체한다.
# 실제 2바퀴 레시피를 그대로 상속하고 규모만 줄인다: 1바퀴 마지막 ckpt(step_167) 의 하드링크 사본에서 **1 step(168)** 만 학습하고 저장한다.
#   - 첫 step 은 ckpt 에 저장된 리플레이 버퍼(1바퀴 실제 궤적, 최대 48K)에서 16 그룹을 꺼내 학습한다 → 패킹·CP8·TIS·마스킹·전역 배치 4개 경로가 실제 데이터로 돈다.
#   - 잡는 결함: 설정 검증(F1) · 옵티마이저 로드(F2) · 데이터로더 가드 줄(F3) · logprob 패스 실행 · 전역 배치 4개(num_valid_samples ≈ 64) · 비율/클립 지표 존재 ·
#     저장된 ckpt 의 옵티마이저 step 수 = 4 (롤아웃당 4회의 직접 증거) · 재개 첫 step 의 GPU·호스트 메모리 경로 (1/8 배치).
#   - 못 잡는 것: 전체 배치(2,048행) 메모리 피크 · 4회 업데이트가 생성에 미치는 영향 → ③ 실제 런 step 168~170.
#   - 시간: 셋업 약 10분 + step 1개 약 5분 + 저장 약 3분 ≈ 20분. step 169 용 생성은 병행되다 종료 때 버려진다. 검증은 끈다 (256 × 48K 는 20분 이상).
# 실행 (WANDB=0; 사본: mkdir ckpt128_smoke && cp -al ckpt128/step_167 ckpt128_smoke/ && cp ckpt128/latest_checkpoint_status.json ckpt128_smoke/):
#   WANDB=0 RECIPE=examples/configs/alpha/teacher_codemath_s3r2_resume_smoke.yaml DATA=<round2 blend> VAL=<s2 _val> \
#     CKPT=results/alpha/teacher_codemath_s3/ckpt128_smoke examples/configs/alpha/runs/launch.sh teacher_codemath_s3 r2smoke ++policy.megatron_cfg.checkpoint.load_optim=false
defaults: teacher_codemath_s3r2_alpha.yaml

grpo:
  num_prompts_per_step: 16
  max_num_steps: 168                    # 재개 step 167 → step 168 하나만 (저장 주기 4 → step 168 저장)
  val_period: 10000
  val_at_end: false
  async_grpo:
    rollout_overprovision: 15           # 16 + 15 그룹 (1바퀴 128 + 125 와 같은 비율)

policy:
  train_global_batch_size: 64           # 16 × 16 ÷ 4 = 전역 배치 4개
