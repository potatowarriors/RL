# teacher_stem_alpha.yaml — 1차 STEM teacher (RL_PLAN.md 결정 18·19·21, docs/RL_DATA.md §5.4).
#
# 검증된 RLVR 설정(student_rlvr1_alpha.yaml: 2노드 분리 · async age 2 · chunked prefill · Muon warmup 10 · GBS 1,024 ·
# 128K/CP8 · R3 · GDN 상태 fp32 · strict 도구 유지 · KL 0 + threshold 2 · 페널티 4종)을 그대로 상속한다.
# 바꾸는 것은 데이터 · 스텝 · 생성 상한 · 롤아웃 GPU 수 · Gym 환경 · judge · lr 이다 (학습 메모리·CP 설정이 같아 R4 재측정 대상이 아니다).
# lr 5e-6 (사용자 결정 2026-10-09, RL_PLAN.md 결정 23): 부모 1e-6 은 bf16 가중치에 갱신의 12% 만 반영된다
#   (docs/KNOWN_ISSUES.md "bf16 가중치에 갱신이 반영되지 않는다"). step 50 에서 tools/measure_bf16_delivery.py 로 잰다.
#
# judge 배치 (결정 21): 롤아웃 노드 GPU 8장 = vLLM 롤아웃 6장 + Gym judge 2장 (Gemma-4-31B-it TP2, Gym local_vllm_model 이
# Ray 로 남은 GPU 에 띄운다). 2노드 비-colocated 에서 롤아웃이 노드 일부만 쓰려면 본체 수정 `alpha/judge-split` 이 필요하다
# (grpo.py — upstream 은 노드 전체만 허용, 남는 GPU 가 있으면 학습 placement group 을 먼저 잡는다).
# 블렌드: teacher_stem_v2.jsonl (52,500 = 820 스텝 × 64) — 객관식 · 퍼즐 · 화학(rdkit) · 주관식(judge) · python 도구 과학(sandbox + judge).
#   v2 = v1 에서 정답이 자기 output_regex 에 잘리는 Science-v1 636행을 같은 유형 행으로 교체 (결정 25, tools/fix_stem_sci_regex.py).
#
# 실행 전 검사 (CPU):  python examples/configs/alpha/tools/check_alpha_recipe.py examples/configs/alpha/teacher_stem_alpha.yaml \
#                        data.train.data_path=<teacher_stem_v2.jsonl>   (데이터를 주면 agent · verifier · 정답 추출을 대조한다)
# 실행: RECIPE=examples/configs/alpha/teacher_stem_alpha.yaml DATA=<teacher_stem_v2.jsonl> VAL=<teacher_stem_v2_val.jsonl> \
#         examples/configs/alpha/runs/launch.sh teacher_stem <tag> policy.model_name=<hfmodel_0002862>
# 전제: gpu06 sandbox 터널 ($NRL_ROOT/sandbox/tunnel.sh, main1 0.0.0.0:6000) · Gemma 가중치 /home/work/vidsearch/models/gemma-4-31B-it
defaults: student_rlvr1_alpha.yaml

checkpointing:
  checkpoint_dir: "results/alpha_teacher_stem"

grpo:
  max_num_steps: 820                    # 규모 B (결정 19): 52,500 프롬프트 1 에폭

policy:
  generation:
    max_new_tokens: 32768               # STEM 32K (RL_DATA.md §5.2 — mcqa 생성 평균 7.5K, GPQA 18.8K)
    colocated:
      resources:
        gpus_per_node: 6                # 롤아웃 노드의 나머지 2장은 Gym judge (결정 21)
        num_nodes: 1
  megatron_cfg:
    optimizer:
      lr: 5.0e-6                        # 결정 23 — 부모 1e-6 의 5배, 도구 teacher 3e-6 보다 공격적
      min_lr: 5.0e-6                    # warmup 10 (1e-7 → 5e-6) 은 부모 그대로

env:
  _override_: true
  should_use_nemo_gym: true
  should_log_nemo_gym_responses: true
  nemo_gym:
    nemo_gym_log_dir: "logs/nemo_gym"
    skip_venv_if_present: true
    port_range_low: 5000
    port_range_high: 5999
    effort_levels:                      # 부모와 같다
      low_string: "{reasoning effort: efficient}"
      low_weight: 0.1
      low_penalty: 1
      low_ub: 15000
    invalid_tool_call_patterns: ["<tool_call>", "</tool_call>", "<function_call>", "</function_call>"]
    thinking_tags: ["<think>", "</think>"]
    config_paths:
      # strict 유지 서버 (결정 13). NEMO_GYM_EXTRA_ROOTS=<NeMo-RL>/examples/configs/alpha/gym_plugins (launch.sh 가 넘긴다)
      - responses_api_models/alpha_vllm_model/configs/alpha_vllm_model_for_training.yaml
      - resources_servers/mcqa/configs/mcqa.yaml
      - resources_servers/reasoning_gym/configs/reasoning_gym.yaml
      - resources_servers/rdkit_chemistry/configs/rdkit_chemistry.yaml               # alpha 플러그인 — Gym 0.6.0 에 없는 Ultra 환경
      - resources_servers/equivalence_llm_judge/configs/equivalence_llm_judge.yaml   # judge = judge_model (아래)
      - resources_servers/ns_tools/configs/ns_tools.yaml                             # sandbox + 행의 verifier_type 채점기
      - resources_servers/math_with_judge/configs/math_with_judge.yaml               # ns_tools 의 기본 채점기 (Science-v1 행은 쓰지 않는다)
    policy_model:
      responses_api_models:
        alpha_vllm_model:
          num_workers: 8
          num_groups_nemo_rl: ${add:${grpo.async_grpo.max_trajectory_age_steps}, 1}
          chat_template_kwargs: null
    policy_model_reasoning_off:
      _copy: policy_model
      responses_api_models:
        alpha_vllm_model:
          num_workers: 2
          num_groups_nemo_rl: ${add:${grpo.async_grpo.max_trajectory_age_steps}, 1}
          chat_template_kwargs:
            enable_thinking: false
    # judge: Gemma-4-31B-it (사용자 결정 2026-10-08) — thinking 끔. Ray 가 롤아웃 노드의 남은 GPU 2장에 TP2 로 올린다.
    # vLLM DP 모드는 쓰지 않는다 (KNOWN_ISSUES 2026-10-08 double free). Ray 액터는 NeMo-RL vLLM 워커 venv(vLLM 0.25.1)로 돈다.
    judge_model:
      responses_api_models:
        local_vllm_model:
          entrypoint: app.py
          model: /home/work/vidsearch/models/gemma-4-31B-it
          return_token_id_information: false
          uses_reasoning_parser: false
          hf_home: /home/work/vidsearch/tools/nemo_rl/hf
          debug: false
          ray_worker_py_executable: /home/work/vidsearch/tools/nemo_rl/venvs/nemo_rl.models.generation.vllm.vllm_worker_async.VllmAsyncGenerationWorker/bin/python
          vllm_serve_env_vars:
            VLLM_RAY_DP_PACK_STRATEGY: strict
            HF_HUB_OFFLINE: "1"
          vllm_serve_kwargs:
            tensor_parallel_size: 2
            data_parallel_size: 1
            pipeline_parallel_size: 1
            gpu_memory_utilization: 0.9
            max_model_len: 65536
            language_model_only: true   # Gemma4 비전 인코더를 싣지 않는다
            enable_chunked_prefill: true
            max_num_seqs: 256
    equivalence_llm_judge:
      resources_servers:
        equivalence_llm_judge:
          judge_model_server:
            type: responses_api_models
            name: judge_model           # 기본값은 정책 자신(policy_model)이다 — 반드시 덮어쓴다
          judge_responses_create_params:
            input: []
            temperature: 0.0
            max_output_tokens: 2048
          # 재판정 (결정 25, KNOWN_ISSUES 2026-10-10): 행별 output_regex(Science-v1)로 꺼낸 답이 틀리면 최종 응답 전체로 한 번 더
          # 판정해 맞으면 0.5. 모델 답 속 닫는 문자(`\)`·`f(x)`·`]`)에서 추출이 잘린 정답을 살린다. Gym 설정 파일은 끈다(false · 0.0).
          # 정규식이 없는 행(Ultra reasoning · ExamQA)에는 걸리지 않는다. 길이 기준(extraction_length_threshold)은 Gym 설정대로 null.
          check_full_generation_on_fail: true
          reward_if_full_generation_succeeds: 0.5
    math_with_judge:
      resources_servers:
        math_with_judge:
          should_use_judge: true        # math-verify 가 틀리면 judge 에게 묻는다 (Science-v1 답의 97% 가 서술형)
          judge_model_server:
            type: responses_api_models
            name: judge_model
          judge_responses_create_params:
            input: []
            temperature: 0.0
            max_output_tokens: 2048
    ns_tools:
      resources_servers:
        ns_tools:
          sandbox_host: 10.0.37.4       # main1 터널 → gpu06 alpha-eval NeMo-Skills sandbox (RL_DATA.md §5.9)
          sandbox_port: "6000"          # NSToolsConfig.sandbox_port 는 str — 정수면 ns_tools 가 기동에서 죽는다 (J1 2026-10-10)
          verifiers:                    # Science-v1 python 도구 행의 verifier_type 은 equivalence_llm_judge 다 — 없으면 "Unknown verifier"
            equivalence_llm_judge:
              type: resources_servers
              name: equivalence_llm_judge
          nemo_skills_tool_overrides:
            DirectPythonTool:
              exec_timeout_s: 120       # Science-v1 도구 설명이 "120초 뒤 시간 초과"라고 알린다 (Gym 기본 10초)

logger:
  wandb:
    project: alpha-rl
