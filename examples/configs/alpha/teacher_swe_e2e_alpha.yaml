# teacher_swe_e2e_alpha.yaml — SWE E2E teacher (2026-11-24 초안 · 11-26 본 런 s4 는 8 × 8 · 11-27 결정 94 로 32 × 8 — docs/E2E_SANDBOX.md §7 · RL_PLAN 결정 76 ~ 94).
#
# 과제마다 Apptainer 컨테이너를 둘 띄운다 (Gym `swe_agents`): 에이전트 컨테이너에서 모델이 도구 (셸 · 파일 편집) 로 저장소를 고치고,
# 채점 컨테이너가 그 패치로 테스트를 돌린다. 보상은 0/1 이다 — FAIL_TO_PASS · PASS_TO_PASS 가 모두 통과할 때 1.
#
# 데이터 = Ultra 블렌드 `swe.jsonl` (사용자 결정 2026-11-24 "학습데이터를 ultra 블렌드로 바꿔"). 기준선의 SWE teacher 레시피는
# examples/nemo_gym/nemotron-3-ultra/swe_teacher.yaml (32 × 16 · lr 3e-6 · 196,608 · 200 턴 · 3,600 s · 4 에폭 약 964 step, 128 노드) 이다.
# 그 규모는 2 노드에 그대로 못 옮긴다 — 배치 · 문맥 · 턴은 문맥 131,072 인 가장 가까운 제공 레시피
# examples/nemo_gym/grpo_qwen3_30ba3b_thinking_swe2.yaml (Qwen3-30B-A3B, 같은 프레임워크) 를 기본안으로 삼았다. 그 값을 그대로 따른 것:
#   8 × 8 · advantage clip ±100 · 잘못된 도구 호출 / 사고 태그 advantage −5 · overlong_filtering · 궤적 나이 1 ·
#   200 턴 · 에이전트 1,800 s · 실패 롤아웃 마스킹 · 학습 중 검증 없음 · prefix caching 켬.
#   프롬프트 혼합은 가이드의 `run_with_mixed_prompts` 대신 `agent_prompt_overrides` 로 쓴다 — 이 Gym (3045a793) 은 앞의 키를 구현하지 않는다 (결정 81).
# 벗어난 것과 이유:
#   lr 3e-6 (가이드 1e-6)        — alpha 는 bf16 가중치라 1e-6 갱신의 약 12% 만 반영된다 (결정 22 · 23). Ultra SWE teacher · Xiaomi MOPD 도 3e-6.
#   옵티마이저 Muon               — alpha 공통 (부모 상속).
#   턴당 생성 상한 8,192 (가이드 131,072) — alpha 도구 teacher 값. `</think>` 를 닫지 않는 턴이 문맥 전체를 쓰는 것을 막는다 (KNOWN_ISSUES 11-14).
#   동시 실행 128 (가이드 768)   — 2 노드 440 코어. step 당 롤아웃 64 개 × 겹치는 배치 2 개. 컨테이너 쓰기 공간 16 GB 가 세션 메모리에
#                                  잡히므로 128 × 16 GB = 2,048 GiB (두 노드 합 한도 3,544 GiB) 가 상한 근거다.
#   모델 서버 alpha_vllm_model    — strict 도구 렌더 유지 (결정 13).
# 스모크에서 재서 정할 것: 턴당 생성 상한의 잘림 비율 · 동시 실행 · 메모리 상한 · step 시간.
#
# 시작점: MOPD1 학생 results/alpha/mopd1/hf/hf_step_00120 (SWE-V 12.0).
# 데이터: RL/Nemotron-RL-Ultra-Training-Blends/swe.jsonl 7,816 (SWE-rebench-V2 7,610 다국어 · SWE-Gym 206). 8 × 8 이면 1 에폭 = 977 스텝.
#   SWE-rebench 행은 Gym 의 정답 패치 검증 (verify_golden_patch) 으로 과제를 미리 거를 수 있다 (docs/E2E_SANDBOX.md §7.6).
#   학습 규모 (에폭 · 스텝) 는 스모크에서 잰 롤아웃 처리량으로 정한다 — 결정 대기.
# 이미지: $NRL_ROOT/sif/swe/ (tools/apptainer/build_sifs.py — Ultra 이미지 7,785 개는 변환 승인 대기). 하니스 셋업: $NRL_ROOT/gym_cache/swe_agents/.
# 전제 (세션마다): tools/apptainer/setup_session.sh --pid-mode bindproc --sessiondir-mb 16384 (두 노드) ·
#   runs/ray_cluster.sh start (raylet 환경에 APPTAINER_BIND=/proc).
#
# 실행: RECIPE=examples/configs/alpha/teacher_swe_e2e_alpha.yaml DATA=<swe.jsonl> VAL=<swe.jsonl> \
#         examples/configs/alpha/runs/launch.sh teacher_swe_e2e <tag> policy.model_name=<mopd1/hf/hf_step_00120>
defaults: teacher_tool_alpha.yaml

checkpointing:
  checkpoint_dir: "results/alpha_teacher_swe_e2e"
  save_period: 5                        # 결정 94 (32 × 8 — 과제 160 개 · 약 5.7 시간마다; 8 × 8 때는 20). 1 개 약 155 GB. 전부 HF 로 반출한다 (tools/export_watch.sh)
  keep_top_k: 10                        # 최근 10 개만 남는다 (재개용 순환 1.6 TB) — 점수로 고르는 것이 아니다

grpo:
  # 결정 94 (사용자 2026-11-27 "32*8로 적용하자"): 8 × 8 (Qwen3 가이드 값, s4) 에서는 보상이 갈리는 그룹이 5.5% 라 업데이트의 3 분의 2 가
  # 과제 신호 없이 형식 벌점만으로 움직였다. 프롬프트 32 면 업데이트의 84% 에 신호가 든다 (하루 업데이트 84 → 21, 하루에 보는 과제 수는 같다).
  # 이 데이터의 공개 레시피 (Ultra swe_teacher) 는 32 × 16 — 생성 16 은 신호 비율 5.7 → 7.4% (추정) 에 과제당 비용 2 배라 8 로 둔다.
  num_prompts_per_step: 32              # 롤아웃 256 개 / step · 약 68 분
  num_generations_per_prompt: 8
  max_num_steps: 218                    # 1 에폭 (7,002 // 32). 중간 체크포인트를 보며 멈춘다 (결정 92)
  max_num_epochs: 2                     # step 수는 max_num_steps 가 정한다. 2 로 두는 것은 재개 때문이다 — 저장되는 데이터 위치가 진행 중인 배치 둘만큼
                                        # 앞서 있어, 재개하면 프롬프트를 최대 64 개 건너뛴다. 218 × 32 = 6,976 이 7,002 행에 거의 맞아 1 이면 218 전에 데이터가 끝난다
  advantage_clip_low: -100
  advantage_clip_high: 100
  overlong_filtering: true
  val_period: 100000                    # 가이드와 같이 학습 중 검증 없음 — 판정은 SWE-V 벤치
  val_at_start: false
  val_at_end: false
  # 벌점을 켜는 것은 `*_advantage` 값이다. 아래 불리언 둘과 `invalid_tool_call_strategy` 는 Ultra 레시피에서 옮겨 온 키로 코드가 읽지 않는다.
  # 턴 전체 −5 로 시작한다 (결정 88) — 표지 비중 · 엔트로피 · 턴당 생성 길이를 본 런 첫 step 들에서 본다 (`docs/FRONTIER.md` "보상 · 벌점").
  invalid_tool_call_strategy: ''
  penalize_invalid_tool_call: true
  invalid_tool_call_advantage: -5.0
  penalize_malformed_thinking: true
  malformed_thinking_advantage: -5.0
  async_grpo:
    max_trajectory_age_steps: 1         # 가이드 · Ultra SWE teacher 값 (alpha 단일 스텝 레시피는 2)
    rollout_group_log: ${logger.log_dir}/rollout_groups.jsonl   # 그룹별 보상 · 생성 토큰 수 (launch.sh 가 절대경로 log_dir 을 준다). step 덤프 없이 관문 점검기가 쓴다

policy:
  megatron_cfg:
    scheduler:
      lr_warmup_iters: 3                # 결정 94 — 부모는 10 step. 32 × 8 은 step 당 68 분이라 3 step (롤아웃 768 개, 8 × 8 의 10 step 640 개와 비슷)
  # R3 (라우터 재생) 는 SWE E2E 에서 끈다 (사용자 2026-11-26 "R3 없이 SWE E2E 로 KL 측정"): swe_agents 하니스 (컨테이너 안의 OpenHands) 가
  # expert 경로를 넘기지 않아 NeMo-RL 이 예외를 던진다 (docs/E2E_SANDBOX.md §7.9). 공개 E2E SWE 레시피 셋도 R3 없이 돈다.
  # R3 없이 잰 KL 은 단일 턴에서 0.0015 (기준 0.001 초과) — SWE 다중 턴의 값은 S3 에서 잰다.
  router_replay:
    enabled: false
  generation:
    max_new_tokens: 8192                # 턴당 상한 (부모 값 그대로 명시). 가이드는 문맥 전체
    vllm_cfg:
      # D2 (prefix caching 끔) 를 SWE E2E 에서 뒤집는다: 다중 턴은 턴마다 문맥 전체를 다시 보낸다 (캐시 끔 측정에서 prefill 의 98% 가 재계산).
      # 근거: PC-S 학습 엔진 설정 통과 (docs/GATES.md), 공개 E2E SWE 레시피 셋 모두 켬. 가중치 갱신 뒤에도 캐시는 비워지지 않는다
      # (recompute_kv_cache_after_weight_updates: false — 공개 레시피와 같은 값, §7.9).
      enable_prefix_caching: true

# 결정 94: think 태그 위반이 한 턴이라도 있으면 롤아웃 보상을 0 으로 만드는 규칙을 이 레시피에서 끈다. 130 턴짜리 롤아웃은 32 ~ 41% 가 걸리고
# (s4: 해결한 75 개 중 위반 7 개가 전부 보상 0, 그중 5 개는 음의 advantage), 단일 턴에서 검증한 규칙이다 (부모 주석). 나머지 셋은 부모 그대로 켠다
# (s4 발동: 빈 최종 답 34 건 · 원치 않는 토큰 0 건). 턴 단위 벌점 (`malformed_thinking_advantage`) 은 그대로다.
reward_penalties:
  penalize_malformed_think_tag: false

env:
  # true = step 덤프 (`train_data_step*.jsonl`) 를 건너뛴다 (`grpo.py` `_should_log_nemo_gym_responses`). 다중 턴 궤적 전체라 32 행에 160 MB 다 (결정 87).
  # 토큰별 KL 분석이 필요한 스모크만 `env.should_log_nemo_gym_responses=false loss_fn.seq_logprob_error_in_loss=false` 로 덮어쓴다 (GATES "S3").
  should_log_nemo_gym_responses: true
  should_mask_flagged_samples: true     # 타임아웃 · OOM · 한도에 걸린 롤아웃은 손실에서 뺀다 (swe_agents 가 mask_sample 을 붙인다)
  nemo_gym:
    cache_dir: /home/work/vidsearch/tools/nemo_rl/gym_cache    # 하니스 셋업 트리 (OpenHands · R2E-Gym · SWE-bench) — 두 노드 공용 NFS
    use_absolute_ip: true
    # 하니스 (nv-OpenHands) 가 거부한 도구 호출의 오류 응답. 도구 출력이 이 정규식으로 시작하고 `name` 이 그 호출의 도구 이름과 같으면,
    # 그 호출을 낸 모델 턴을 잘못된 도구 호출로 표시해 `grpo.invalid_tool_call_advantage` 를 건다 (결정 88).
    # 파서가 호출로 읽었지만 인자 검증 · 도구 이름에서 걸린 것이라 본문 문자열 탐지 (`invalid_tool_call_patterns`) 에는 안 잡힌다.
    # 전제: `tools/apply_harness_patches.sh check` 통과 — 패치가 없으면 하니스가 그 턴과 오류 문구를 대화에서 뺀다 (`docs/E2E_SANDBOX.md` §7.11).
    invalid_tool_call_output_patterns:
      - 'Validation failure for (?P<name>[^:\n]+): '
      - '(?s)Tool (?P<name>.+?) is not registered\. \(arguments: '
    config_paths:
      - responses_api_models/alpha_vllm_model/configs/alpha_vllm_model_for_training.yaml
      - responses_api_agents/swe_agents/configs/swebench_openhands_training.yaml
    swe_agents_train:
      responses_api_agents:
        swe_agents:
          agent_max_turns: 200
          concurrency: 128
          swebench_agent_timeout: 1800
          # 결정 95 (사용자 2026-11-27 "미완 궤적에 보상벌점 방식을 적용하자"): 턴 한도 · 문맥 한도에 걸려 끝나고 과제를 풀지 못한 롤아웃은 보상 −1 을
          # 받고 손실에 남는다 (Gym 패치 0003 — 기본은 채점한 보상 + 마스킹). 시간 초과 · 메모리 초과 · 채점 시간 초과와, 한도에 걸렸지만 푼 롤아웃은
          # 그대로 마스킹한다. 근거: `s4` · `s5` 에서 턴이 33% 길어지며 마스킹이 33 → 47% 로 늘었는데 마스킹된 롤아웃은 손실에 없어 교정 신호가 없었다.
          # 벌점의 크기는 그룹 안 정규화 때문에 결과를 바꾸지 않는다 (docs/E2E_SANDBOX.md §7.13). Qwen3-Coder-Next · Kimi K3 (−1) 와 같은 형태.
          unfinished_trajectory_reward: -1.0
          agent_prompt_override_random: false   # 결정 81 · 89: 세 틀 (Codex · OpenCode · CodeAct) 을 과제 ID 를 시드로 고른다 — 한 과제의 롤아웃은 같은 틀이다.
          # true (롤아웃마다 무작위) 면 첫 프롬프트가 달라져 한 과제의 8 개가 틀별로 갈린 채 baseline 이 계산된다 (docs/E2E_SANDBOX.md §7.12).
          agent_prompt_overrides:
            - user_prompt_template: responses_api_agents/swe_agents/prompts/codex/user_prompt.j2
              system_prompt_template: responses_api_agents/swe_agents/prompts/codex/system_prompt.j2
              agent_cls: CodexAgent
              diversify_tool_names: false
            - user_prompt_template: responses_api_agents/swe_agents/prompts/opencode/user_prompt.j2
              system_prompt_template: responses_api_agents/swe_agents/prompts/opencode/system_prompt.j2
              agent_cls: OpenCodeAgent
              diversify_tool_names: false
            - user_prompt_template: responses_api_agents/swe_agents/prompts/openhands/user_prompt.j2
              system_prompt_template: responses_api_agents/swe_agents/prompts/openhands/system_prompt.j2
              agent_cls: CodeActAgent
              diversify_tool_names: false
          dataset_path: ${data.train.data_path}
          container_formatter:
            - /home/work/vidsearch/tools/nemo_rl/sif/swe/r2egym_{instance_id}.sif
            - /home/work/vidsearch/tools/nemo_rl/sif/swe/swegym_sweb.eval.x86_64.{instance_id}.sif
            - /home/work/vidsearch/tools/nemo_rl/sif/swe/swerebench/{instance_id}.sif
    swe_agents_val:
      responses_api_agents:
        swe_agents:
          agent_max_turns: 200
          concurrency: 128
          swebench_agent_timeout: 1800
          agent_prompt_override_random: false   # 결정 81 · 89: 세 틀 (Codex · OpenCode · CodeAct) 을 과제 ID 를 시드로 고른다 — 한 과제의 롤아웃은 같은 틀이다.
          # true (롤아웃마다 무작위) 면 첫 프롬프트가 달라져 한 과제의 8 개가 틀별로 갈린 채 baseline 이 계산된다 (docs/E2E_SANDBOX.md §7.12).
          agent_prompt_overrides:
            - user_prompt_template: responses_api_agents/swe_agents/prompts/codex/user_prompt.j2
              system_prompt_template: responses_api_agents/swe_agents/prompts/codex/system_prompt.j2
              agent_cls: CodexAgent
              diversify_tool_names: false
            - user_prompt_template: responses_api_agents/swe_agents/prompts/opencode/user_prompt.j2
              system_prompt_template: responses_api_agents/swe_agents/prompts/opencode/system_prompt.j2
              agent_cls: OpenCodeAgent
              diversify_tool_names: false
            - user_prompt_template: responses_api_agents/swe_agents/prompts/openhands/user_prompt.j2
              system_prompt_template: responses_api_agents/swe_agents/prompts/openhands/system_prompt.j2
              agent_cls: CodeActAgent
              diversify_tool_names: false
          dataset_path: ${data.validation.data_path}
          container_formatter:
            - /home/work/vidsearch/tools/nemo_rl/sif/swe/r2egym_{instance_id}.sif
            - /home/work/vidsearch/tools/nemo_rl/sif/swe/swegym_sweb.eval.x86_64.{instance_id}.sif
            - /home/work/vidsearch/tools/nemo_rl/sif/swe/swerebench/{instance_id}.sif

logger:
  wandb:
    # 부모 (student_rlvr1_alpha.yaml) 의 목록에 SWE E2E 의 감시 지표를 더한 것이다 — 목록은 덮어쓰이므로 부모 것을 다시 적는다.
    metric_allowlist:
      - train/total_reward/mean                       # 보상
      - train/[^/]+/reward/mean                       # agent 별 보상
      - train/(loss|grad_norm|lr|approx_entropy)      # 최적화
      - train/(gen_kl_error|token_mult_prob_error|num_masked_seqs_by_logprob_error|avg_trajectory_age)  # rollout↔학습 정합
      - train/gen_tokens_per_sample/(mean|max)        # 길이
      - train/(truncation_rate|natural_termination_rate|malformed_think_tag_rate|empty_final_answer_rate)  # 형식
      - timing/train/(total_step_time|exposed_generation|policy_training|weight_sync)  # 속도 · refit
      - performance/(tokens_per_sec|generation_tokens_per_sec)
      # SWE E2E 감시 (GATES "S4"): 하니스 거부 · 잘못된 도구 호출 · 턴 · 유효 시퀀스 · 해결률
      - train/swe_agents_train/num_harness_rejected_tool_calls/(mean|max)
      - train/(invalid_tool_call_rate|malformed_thinking_rate)
      - train/turns_per_sample/mean
      - train/max_gen_tokens_per_turn/mean
      - train/(global_valid_seqs|seq_logprob_error_valid_seqs|num_mask_sample_filtered)
      - train/swe_agents_train/(resolved|patch_exists|unfinished_penalized)/mean
