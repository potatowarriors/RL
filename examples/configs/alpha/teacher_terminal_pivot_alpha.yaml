# teacher_terminal_pivot_alpha.yaml — agentic teacher 단계의 terminal 피벗 teacher (RL_PLAN.md 결정 59 · 62 · 63, docs/RL_DATA.md §6).
#
# 도구 사용 teacher 레시피(teacher_tool_alpha.yaml: 2노드 분리 · async age 2 · Muon lr 3e-6 warmup 10 · 64 × 16 = GBS 1,024 ·
# 128K/CP8 · 생성 8,192 · R3 · GDN 상태 fp32 · KL 0)을 그대로 상속한다. 바꾸는 것은 데이터 · 스텝 · 에폭 · Gym 환경 · 채점 임계다.
#
# 시작점: MOPD1 학생 results/alpha/mopd1/hf/hf_step_00120 (시작점 게이트 M1 · M2 · M4 · R1 PASS 2026-11-12, GATES.md).
# 블렌드: alpha_blends/teacher_blends/teacher_terminal_pivot_v1.jsonl 6,424 행 (tools/build_terminal_pivot_blend.py) — HF Terminal-Pivot-v1
#         31,111 행을 MOPD1 학생으로 8회씩 프로파일링해 임계 0.7 에서 1~7회 통과한 행만, 작업 완료 선언 행은 15% 상한.
#         검증셋 teacher_terminal_pivot_v1_val.jsonl 329 (과제 30 개를 통째로 뗐다).
# 채점: terminus_judge_string_only — Terminus-2 JSON 스키마 + task_complete 일치 + keystrokes 문자열 유사도. LLM judge 없음.
#       임계는 공개 설정 0.9 대신 0.7 (결정 62). 첫 step 의 Gym 로그 `threshold=0.7` 과 보상(프로파일링 평균 0.33 근처)으로 적용을 확인한다.
# 규모: 2 에폭 = 200 스텝 (6,424 // 64 = 100 스텝/에폭). step 100 반출본으로 TB-2.1 을 먼저 잰다 (결정 63).
#
# 실행 전 검사 (CPU):  python examples/configs/alpha/tools/check_alpha_recipe.py examples/configs/alpha/teacher_terminal_pivot_alpha.yaml \
#                         data.train.data_path=<teacher_terminal_pivot_v1.jsonl>
# 실행: RECIPE=examples/configs/alpha/teacher_terminal_pivot_alpha.yaml DATA=<teacher_terminal_pivot_v1.jsonl> VAL=<…_v1_val.jsonl> \
#         examples/configs/alpha/runs/launch.sh teacher_terminal_pivot <tag> policy.model_name=<mopd1/hf/hf_step_00120>
defaults: teacher_tool_alpha.yaml

checkpointing:
  checkpoint_dir: "results/alpha_teacher_terminal_pivot"

grpo:
  max_num_steps: 200                    # 2 에폭 × 100 스텝 (결정 63)
  max_num_epochs: 2                     # async 루프가 max_num_steps 를 max_num_epochs × (행 수 // 프롬프트 수) 로 자른다

env:
  nemo_gym:
    config_paths:
      # strict 유지 서버 (결정 13). NEMO_GYM_EXTRA_ROOTS=<NeMo-RL>/examples/configs/alpha/gym_plugins (launch.sh 가 넘긴다)
      - responses_api_models/alpha_vllm_model/configs/alpha_vllm_model_for_training.yaml
      - resources_servers/terminus_judge/configs/terminus_judge_string_only.yaml
    terminus_judge_string_only_resources_server:
      resources_servers:
        terminus_judge:
          string_similarity_threshold: 0.7   # 결정 62 — Gym 설정 파일의 0.9 를 덮어쓴다
