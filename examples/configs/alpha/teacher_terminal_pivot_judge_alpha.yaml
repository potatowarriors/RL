# teacher_terminal_pivot_judge_alpha.yaml — terminal 피벗 teacher, 논문 방식 보상 (RL_PLAN.md 결정 65, docs/KNOWN_ISSUES.md 2026-11-16).
#
# teacher_terminal_pivot_alpha.yaml (문자열 유사도 0.7 · judge 없음) 은 TB-2.1 에서 시작점보다 나빴다 — 기울기가 빈 대기 · 직전 명령 반복에
# 몰렸다. 이 레시피는 PivotRL (arXiv 2603.21383 A.2) 의 terminal 검증기를 쓴다: 스키마 + 완전 일치 빠른 통과 + 아니면 등가 LLM judge
# (alpha 플러그인 `alpha_terminus_judge` = Gym `terminus_judge` + 완료 선언 양방향 검사, 프롬프트 rubrics_v4, 빠른 통과는 완전 일치만 — 결정 66). 블렌드는 judge 기준 재프로파일링 뒤 분산 > 0 ∧ 평균 < λ 필터 + 정답 명령 중복 제거로 만든다.
#
# 도구 teacher 레시피를 상속한다 (2노드 분리 · async age 2 · Muon lr 3e-6 warmup 10 · 64 × 16 · 128K/CP8 · 생성 8,192 · R3 · KL 0).
# judge: Gemma-4-31B-it TP2 — 롤아웃 노드 GPU 8장 중 2장 (STEM teacher 와 같은 구성, 결정 21 · 게이트 J1). 롤아웃 vLLM 은 6장.
# judge 판정 품질은 게이트 TJ1 (tools/measure_judge_terminus.py) 로 확인한다.
# 데이터 행의 agent_ref 는 `alpha_terminus_judge_simple_agent` 여야 한다 (원본의 `terminus_judge_string_only_simple_agent` 는 judge 없는 설정).
#
# 블렌드: alpha_blends/teacher_blends/teacher_terminal_pivot_judge_v4.jsonl 4,360 행 (tools/build_terminal_pivot_judge_blend.py
#         --drop-rerun all --drop-same-obs, 결정 67 · 68) — 제어 키 정답 제외 → judge 기준 통과 1~7/8 ∧ 평균 < 0.5 → 관대한 단일 통과 행 제외 →
#         정답이 최근 6턴 반복 · 직전 근접 · 앞 명령 재실행 · sleep/echo · 빈 대기인 명령 행 제외 → 관측이 직전과 같은 상태의 명령 행 제외 →
#         명령 중복 제거 (1개) → 완료 선언 8.8%. 검증셋 …_judge_v4_val.jsonl 219 (과제 30 개 통째).
#         쏠림: 넓은 반복류 출력의 양의 advantage 몫 2.3% · 들림 0.57, 단서 상태 갈래별 들림 0.0 · 0.73 (기준 ≤ 5% · ≤ 1.0 · 각 ≤ 1.0).
# 규모: 2 에폭 = 136 스텝 (4,360 // 64 = 68 스텝/에폭). 1 에폭 뒤 멈추고 TB-2.1 89 과제 × 2 를 시작점과 짝지어 반복률을 본다 (결정 68).
defaults: teacher_tool_alpha.yaml

checkpointing:
  checkpoint_dir: "results/alpha_teacher_terminal_pivot_judge"

grpo:
  max_num_steps: 136                    # 2 에폭 × 68 스텝
  max_num_epochs: 2                     # async 루프가 max_num_steps 를 max_num_epochs × (행 수 // 프롬프트 수) 로 자른다

policy:
  generation:
    colocated:
      resources:
        gpus_per_node: 6                # 롤아웃 노드의 나머지 2장은 Gym judge
        num_nodes: 1

env:
  nemo_gym:
    config_paths:
      # strict 유지 서버 (결정 13). NEMO_GYM_EXTRA_ROOTS=<NeMo-RL>/examples/configs/alpha/gym_plugins (launch.sh 가 넘긴다)
      - responses_api_models/alpha_vllm_model/configs/alpha_vllm_model_for_training.yaml
      # alpha 플러그인: Gym terminus_judge + 완료 선언 양방향 검사 · 빠른 통과 임계 1.0 · agent max_steps 1 (결정 66)
      - resources_servers/alpha_terminus_judge/configs/alpha_terminus_judge.yaml
    # judge: STEM teacher 와 같은 Gemma-4-31B-it 서버 (thinking 끔). Ray 가 롤아웃 노드의 남은 GPU 2장에 TP2 로 올린다.
    judge_model:
      responses_api_models:
        local_vllm_model:
          entrypoint: app.py
          model: /home/work/vidsearch/models/gemma-4-31B-it
          return_token_id_information: false
          uses_reasoning_parser: false
          hf_home: /home/work/vidsearch/tools/nemo_rl/hf
          debug: false
          ray_worker_py_executable: /home/work/vidsearch/tools/nemo_rl/venvs/nemo_rl.models.generation.vllm.vllm_worker_async.VllmAsyncGenerationWorker/bin/python
          vllm_serve_env_vars:
            VLLM_RAY_DP_PACK_STRATEGY: strict
            HF_HUB_OFFLINE: "1"
          vllm_serve_kwargs:
            tensor_parallel_size: 2
            data_parallel_size: 1
            pipeline_parallel_size: 1
            gpu_memory_utilization: 0.9
            max_model_len: 65536
            language_model_only: true   # Gemma4 비전 인코더를 싣지 않는다
            enable_chunked_prefill: true
            max_num_seqs: 256
    # 채점 설정은 플러그인 설정 파일이 정본이다 (유사도 1.0 빠른 통과 · judge_model · temperature 0 · 출력 2,048 · swap 끔).
    # 여기서 덮어쓰지 않는다 — 게이트 TJ1 이 병합 결과를 단언한다.
